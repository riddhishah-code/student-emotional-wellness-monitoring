{% extends "wellness/base.html" %}
{% block title %}Questionnaire | Student Wellness{% endblock %}
{% block content %}
<div class="page-heading"><span class="badge">Weekly Wellness Check</span><h1>How has your week been?</h1><p>Answer based on your experiences during the past week. There are no right or wrong answers.</p></div>
<form method="post" class="form-card">{% csrf_token %}<div class="form-grid">
<div class="field full"><label>Student Name</label><input type="text" name="student_name" required maxlength="100" placeholder="Enter your name"></div>
<div class="field full"><label>Course / Class</label><input type="text" name="course" required maxlength="100" placeholder="e.g. BCA"></div>

<div class="field full"><label>1. During the past week, how often did you feel tired even after getting enough rest?</label><select name="tired" required><option value="1">Never</option><option value="2">Rarely</option><option value="3" selected>Sometimes</option><option value="4">Often</option><option value="5">Almost every day</option></select></div>
<div class="field full"><label>2. How often did you find it difficult to concentrate on your studies?</label><select name="concentration" required><option value="1">Never</option><option value="2">Rarely</option><option value="3" selected>Sometimes</option><option value="4">Often</option><option value="5">Almost every day</option></select></div>
<div class="field full"><label>3. How often did you postpone your studies because you felt mentally tired or overwhelmed?</label><select name="overwhelmed" required><option value="1">Never</option><option value="2">Rarely</option><option value="3" selected>Sometimes</option><option value="4">Often</option><option value="5">Almost every day</option></select></div>
<div class="field full"><label>4. During the past week, how often did you enjoy activities that you normally like?</label><select name="enjoyment" required><option value="5">Almost always</option><option value="4">Often</option><option value="3" selected>Sometimes</option><option value="2">Rarely</option><option value="1">Never</option></select></div>
<div class="field full"><label>5. How often did you feel that your studies or assignments were becoming difficult to manage?</label><select name="study_manage" required><option value="1">Never</option><option value="2">Rarely</option><option value="3" selected>Sometimes</option><option value="4">Often</option><option value="5">Almost every day</option></select></div>
<div class="field full"><label>6. How often did you lose focus while studying, even when you wanted to continue?</label><select name="focus" required><option value="1">Never</option><option value="2">Rarely</option><option value="3" selected>Sometimes</option><option value="4">Often</option><option value="5">Almost every day</option></select></div>
<div class="field full"><label>7. When you faced a difficult academic task, how often did you feel able to handle it?</label><select name="handling" required><option value="5">Almost always</option><option value="4">Often</option><option value="3" selected>Sometimes</option><option value="2">Rarely</option><option value="1">Never</option></select></div>
<div class="field full"><label>8. How often did you spend time with friends, family, or people you feel comfortable with?</label><select name="social" required><option value="5">Almost every day</option><option value="4">Often</option><option value="3" selected>Sometimes</option><option value="2">Rarely</option><option value="1">Never</option></select></div>
<div class="field full"><label>9. How often did you feel motivated to start your daily tasks?</label><select name="motivation" required><option value="5">Almost always</option><option value="4">Often</option><option value="3" selected>Sometimes</option><option value="2">Rarely</option><option value="1">Never</option></select></div>
<div class="field full"><label>10. During the past week, did anything happen that affected your studies or daily routine?</label><select name="routine_change" required><option value="1">Not at all</option><option value="2">A little</option><option value="3" selected>Moderately</option><option value="4">Quite a lot</option><option value="5">Very much</option></select></div>
<div class="field full"><label>Anything else you would like to share? (Optional)</label><textarea name="feedback" rows="4" placeholder="You can share anything about your study routine, workload, or week..."></textarea></div>
</div><button class="btn primary full-btn" type="submit">Submit Wellness Check</button></form>
{% endblock %}
